version: '3.8'

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for SQLite persistence
      - ./data:/app/data
      # Mount alembic migrations for auto-sync
      - ./backend/alembic/versions:/app/alembic/versions
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge
