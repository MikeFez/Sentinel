services:
  sentinel:
    image: gitea.fessenden.app/mikefez/sentinel:latest
    container_name: sentinel
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data            # SQLite database (sentinel.db)
    environment:
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://athena.lan:8090/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8:27b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}   # "YourName your@email", for SEC filings
      NEWS_ARTICLE_COUNT: ${NEWS_ARTICLE_COUNT:-10}
    restart: unless-stopped
